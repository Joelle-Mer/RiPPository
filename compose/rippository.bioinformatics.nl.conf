server {
    listen 9410;
    server_name rippository.bioinformatics.nl;

    location /api/ {
        proxy_pass http://localhost:4144;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /export/ {
        proxy_pass http://localhost:4146;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /similarity/ {
        proxy_pass http://localhost:4145;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /annotate-api/ {
        # mgf uploads up to the service's own 64 MB limit; the trailing / strips the prefix
        client_max_body_size 64m;
        proxy_read_timeout 120s;
        proxy_pass http://localhost:4148/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:4147;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
