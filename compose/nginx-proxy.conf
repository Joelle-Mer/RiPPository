events {}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 9410;
        server_name rippository.bioinformatics.nl;

        location /api/ {
            set $upstream http://mb3server:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /export/ {
            set $upstream http://export-service:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /similarity/ {
            set $upstream http://nginx:80;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /annotate-api/ {
            # mgf uploads up to the service's own 64 MB limit
            client_max_body_size 64m;
            proxy_read_timeout 120s;
            rewrite ^/annotate-api/(.*)$ /$1 break;
            set $upstream http://annotator-service:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $upstream http://mb3frontend:3000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
